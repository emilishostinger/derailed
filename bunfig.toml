[test]
preload = ["./apps/server/test/setup.ts"]

# Coverage is off by default so a quick local `bun test foo` stays quick; CI runs
# `bun test --coverage` and gets everything below. The threshold is a ratchet: it
# records the floor the suite has already proven, the run fails if coverage ever
# dips under it, and the only allowed edit is upward. See docs/testing.md.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# Generated code and the dashboard bundle are not what the server suite measures.
coveragePathIgnorePatterns = ["**/generated/**", "apps/web/**", "scripts/**"]

# The ratchet floor. A `bun test --coverage` run fails if line or function coverage
# dips below these, and the only allowed edit is upward: when coverage climbs and
# holds, raise the floor in the same change. Set conservatively from the first
# measured run (line coverage was ~56% with the container suite skipped, higher with
# it running), so CI clears it comfortably today and the room above it is what the
# ratchet closes over time. See docs/testing.md.
coverageThreshold = { line = 0.55, function = 0.55 }
