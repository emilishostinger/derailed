# Continuous integration: every push and pull request gets the same verdict a
# careful contributor would reach locally, plus the parts a laptop usually cannot
# give (a real Docker daemon on Linux, so the integration suite actually runs
# instead of skipping itself).
#
# Two jobs on purpose. The checks job fails fast on style and types in a couple
# of minutes; the test job is the long one, with service containers pulled by the
# suite itself. Keeping them apart means a typo does not cost a 30-minute wait to
# find out.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  test:
    name: full suite with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build detector downloads the Nixpacks binary (about 20 MB) into a
      # per-machine cache the test preload points at. Restoring it saves a
      # download per run and keeps the test that uses it from timing out on a
      # slow mirror.
      - name: restore the nixpacks binary cache
        uses: actions/cache@v4
        with:
          path: /tmp/derailed-nixpacks-cache
          key: nixpacks-${{ runner.os }}
      # Two runs, because the unit and the container tests want opposite things.
      #
      # The unit files run isolated (`--parallel`, each in its own worker) with the
      # Docker socket pointed at nothing, so the container tests self-skip and cannot
      # collide over the one shared test-Caddy. Isolation is what makes this
      # deterministic: without it, a fast single-process run lets the process-global
      # database handle leak between files and a later file 401s on a session it just
      # created. This run carries coverage and its bunfig floor.
      - name: unit tests, isolated, with coverage
        run: DOCKER_SOCKET=/tmp/derailed-no-docker.sock bun test --parallel --coverage
      # The container tests run serially against the runner's real Docker: one file at a
      # time, so nothing fights over the shared Caddy, and each pulls the images it
      # needs. If the daemon is somehow absent they self-skip rather than fail.
      - name: integration tests, serial, real containers
        run: bun test integration
      - name: publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
